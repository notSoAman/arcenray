services:
  media-processor:
    build: .
    image: arcenray-media-processor:1080p-v1
    restart: unless-stopped
    env_file:
      - /etc/arcenray/media-processor.env
    environment:
      PROCESSOR_SCRATCH: /scratch
    volumes:
      - /var/lib/arcenray-media-processor:/scratch
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
